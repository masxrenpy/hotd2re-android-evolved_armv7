name: Android armv7 test build

# Manual run only: Actions tab > "Android armv7 test build" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # SHA-256 fingerprint of the fixed signing key. The build stops if the key in the secret is not this one.
  EXPECTED_FINGERPRINT: "31:98:DA:53:81:4C:DE:BC:41:E2:42:47:AD:7A:8E:75:4B:41:71:13:C3:4A:AB:93:59:6D:35:C6:AF:2C:07:2C"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare the fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.HOTD2_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto HOTD2_KEYSTORE_B64. Crealo en Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$HOME/.android/debug.keystore" 2>/dev/null; then
            echo "::error::El secreto HOTD2_KEYSTORE_B64 no es base64 valido. Copialo completo, sin cortar el final."
            exit 1
          fi
          FOUND=$(keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | grep -i 'fingerprint' | head -1 | sed 's/.*: //')
          echo "Key fingerprint found: $FOUND"
          if [ "$FOUND" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::La clave del secreto no es la esperada. Revisa que copiaste el texto completo."
            exit 1
          fi

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.30.5"

      - name: Download SDL 3.4.18 (pinned, checked by SHA-256)
        run: |
          mkdir -p .work/deps
          curl --fail --location --silent --show-error -o .work/deps/SDL3-3.4.18.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
          echo "9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3  .work/deps/SDL3-3.4.18.tar.gz" | sha256sum -c -
          tar -xzf .work/deps/SDL3-3.4.18.tar.gz -C .work/deps

      - name: Apply the test changes
        run: |
          cat > "$RUNNER_TEMP/apply_changes.py" <<'PY'
          #!/usr/bin/env python3
          """Experimental changes for the armeabi-v7a test build (PowerVR GE8320 start-up failure).

          Usage: apply_changes.py <repo root>   (SDL 3.4.18 must already be extracted in <repo>/.work/deps)
          Every edit asserts that its anchor text exists exactly once, so a mismatch stops the build loudly.
          """
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1]).resolve()


          def edit(path, old, new):
              file = root / path
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  sys.exit(f"ERROR: expected 1 match in {path}, found {count} for: {old[:70]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")
              print(f"patched {path}")


          # 1. Launcher diagnostics: show the real renderer error and the GPU feature line.
          diag = "android/game/src/main/java/com/codepdbh/hotd2evolved/GameDiagnostics.java"
          edit(diag,
               "    private static final int LOG_LIMIT = 24 * 1024;\n",
               "    private static final int LOG_LIMIT = 24 * 1024;\n"
               "    private static final Pattern SAFE_GPU_LINE = Pattern.compile(\"gpu: [A-Za-z0-9 _.:,=()/|-]{1,300}\");\n")
          edit(diag,
               '        if (line.startsWith("renderer: ")) return "Renderer initialization failed";\n',
               '        if (line.startsWith("gpu: ") && SAFE_GPU_LINE.matcher(line).matches()) return line;\n'
               '        if (line.startsWith("renderer: ")) return "Renderer initialization failed: " + cleanDetail(line.substring(10));\n')
          edit(diag,
               "    private static List<String> readLines(Path file) {\n",
               "    private static String cleanDetail(String detail) {\n"
               "        String clean = detail.replaceAll(\"[^A-Za-z0-9 _.:,=()/|-]\", \"?\");\n"
               "        return clean.length() > 240 ? clean.substring(0, 240) : clean;\n"
               "    }\n\n"
               "    private static List<String> readLines(Path file) {\n")
          edit(diag,
               'appendRecent(report, "Engine", engine, 8);',
               'appendRecent(report, "Engine", engine, 24);')

          # 2. Engine: if SDL rejects the GPU, retry without the optional Vulkan features.
          gpu = "src/port/render/sdl_gpu_device.cpp"
          edit(gpu,
               "    SDL_GPUPresentMode presentMode_ = SDL_GPU_PRESENTMODE_VSYNC;\n",
               "    SDL_GPUPresentMode presentMode_ = SDL_GPU_PRESENTMODE_VSYNC;\n"
               "    bool relaxedFeatures_ = false;\n")
          edit(gpu,
               "    if (!dev_) {\n"
               '        if (error) *error = std::string("SDL_CreateGPUDevice: ") + SDL_GetError();\n'
               "        return false;\n"
               "    }\n",
               "    std::string retryNote;\n"
               "#ifdef __ANDROID__\n"
               "    if (!dev_) {\n"
               "        // Some GPUs (PowerVR Rogue, for one) lack optional Vulkan features that SDL asks for by default.\n"
               "        const std::string firstReason = SDL_GetError();\n"
               '        std::fprintf(stderr, "gpu: default Vulkan device failed; retrying without optional features\\n");\n'
               "        const SDL_PropertiesID relaxed = SDL_CreateProperties();\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_SHADERS_SPIRV_BOOLEAN, true);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_DEBUGMODE_BOOLEAN, false);\n"
               "        SDL_SetStringProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_NAME_STRING, driver);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_FEATURE_ANISOTROPY_BOOLEAN, false);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_FEATURE_DEPTH_CLAMPING_BOOLEAN, false);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_FEATURE_CLIP_DISTANCE_BOOLEAN, false);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_FEATURE_INDIRECT_DRAW_FIRST_INSTANCE_BOOLEAN, false);\n"
               "        dev_ = SDL_CreateGPUDeviceWithProperties(relaxed);\n"
               "        SDL_DestroyProperties(relaxed);\n"
               "        if (dev_) {\n"
               "            relaxedFeatures_ = true;\n"
               '            std::fprintf(stderr, "gpu: running without optional Vulkan features\\n");\n'
               "        } else {\n"
               '            retryNote = " (first attempt: " + firstReason + ")";\n'
               "        }\n"
               "    }\n"
               "#endif\n"
               "    if (!dev_) {\n"
               '        if (error) *error = std::string("SDL_CreateGPUDevice: ") + SDL_GetError() + retryNote;\n'
               "        return false;\n"
               "    }\n")
          edit(gpu,
               "capabilities_.maxAnisotropy = 16;",
               "capabilities_.maxAnisotropy = relaxedFeatures_ ? 1 : 16;")
          edit(gpu,
               "if (s.mipmapped && graphics_.anisotropy > 1) {",
               "if (s.mipmapped && graphics_.anisotropy > 1 && !relaxedFeatures_) {")

          # 3. SDL: do not force three features the game does not use, and print what the GPU reports.
          vk = ".work/deps/SDL3-3.4.18/src/gpu/vulkan/SDL_gpu_vulkan.c"
          edit(vk,
               "    features->desiredVulkan10DeviceFeatures.independentBlend = VK_TRUE;\n"
               "    features->desiredVulkan10DeviceFeatures.sampleRateShading = VK_TRUE;\n"
               "    features->desiredVulkan10DeviceFeatures.imageCubeArray = VK_TRUE;\n",
               "    // HOTD2RE test build: the game uses one colour target, no cube arrays and no per-sample shading.\n"
               "    features->desiredVulkan10DeviceFeatures.independentBlend = VK_FALSE;\n"
               "    features->desiredVulkan10DeviceFeatures.sampleRateShading = VK_FALSE;\n"
               "    features->desiredVulkan10DeviceFeatures.imageCubeArray = VK_FALSE;\n")
          edit(vk,
               "    renderer->vkGetPhysicalDeviceFeatures(\n"
               "        physicalDevice,\n"
               "        &deviceFeatures);\n"
               "\n"
               "    if ((!deviceFeatures.independentBlend",
               "    renderer->vkGetPhysicalDeviceFeatures(\n"
               "        physicalDevice,\n"
               "        &deviceFeatures);\n"
               "\n"
               "    {\n"
               "        static int hotd2FeatureLines = 0;\n"
               "        if (hotd2FeatureLines++ < 2) {\n"
               '            fprintf(stderr, "gpu: Vulkan features independentBlend=%d imageCubeArray=%d depthClamp=%d shaderClipDistance=%d drawIndirectFirstInstance=%d sampleRateShading=%d samplerAnisotropy=%d\\n",\n'
               "                        (int)deviceFeatures.independentBlend, (int)deviceFeatures.imageCubeArray, (int)deviceFeatures.depthClamp,\n"
               "                        (int)deviceFeatures.shaderClipDistance, (int)deviceFeatures.drawIndirectFirstInstance,\n"
               "                        (int)deviceFeatures.sampleRateShading, (int)deviceFeatures.samplerAnisotropy);\n"
               "        }\n"
               "    }\n"
               "\n"
               "    if ((!deviceFeatures.independentBlend")
          # 4. Frame-time meter: prints two "gpu: perf" lines every 15 s, which the launcher copies into the report.
          HEADER = r'''// Frame-time meter added for the 32-bit test build. It prints "gpu: perf" lines to stderr and the launcher
          // copies them into the diagnostics report. Everything runs on the game thread.
          #pragma once

          #include <algorithm>
          #include <atomic>
          #include <chrono>
          #include <cmath>
          #include <cstdint>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>

          namespace hotd2perf {

          inline std::atomic<uint32_t> pipelineCreates{0};
          inline std::atomic<uint64_t> pipelineMicros{0};
          inline std::atomic<uint32_t> textureCreates{0};
          inline std::atomic<uint64_t> textureMicros{0};
          inline std::atomic<uint32_t> mipCount{0};
          inline std::atomic<uint64_t> mipMicros{0};
          inline std::atomic<uint32_t> flushCount{0};
          inline std::atomic<uint64_t> flushMicros{0};

          // Adds one event and its duration to a pair of counters when it goes out of scope.
          class Scope {
          public:
              Scope(std::atomic<uint32_t>& count, std::atomic<uint64_t>& micros)
                  : count_(count), micros_(micros), start_(std::chrono::steady_clock::now()) {}
              ~Scope() {
                  const auto us = std::chrono::duration_cast<std::chrono::microseconds>(std::chrono::steady_clock::now() - start_).count();
                  count_.fetch_add(1, std::memory_order_relaxed);
                  micros_.fetch_add(static_cast<uint64_t>(us), std::memory_order_relaxed);
              }
              Scope(const Scope&) = delete;
              Scope& operator=(const Scope&) = delete;

          private:
              std::atomic<uint32_t>& count_;
              std::atomic<uint64_t>& micros_;
              std::chrono::steady_clock::time_point start_;
          };

          inline long ReadKilobytes(const char* path, const char* key) {
              FILE* file = std::fopen(path, "r");
              if (!file) return -1;
              char line[256];
              const size_t keyLength = std::strlen(key);
              long value = -1;
              while (std::fgets(line, sizeof(line), file)) {
                  if (std::strncmp(line, key, keyLength) == 0) {
                      value = std::strtol(line + keyLength, nullptr, 10);
                      break;
                  }
              }
              std::fclose(file);
              return value;
          }

          // Frame times in 0.5 ms buckets up to 250 ms.
          class Histogram {
          public:
              void Add(double ms) {
                  int index = static_cast<int>(ms * 2.0);
                  index = std::max(0, std::min(index, kBuckets - 1));
                  ++bucket_[index];
                  ++count_;
                  sum_ += ms;
                  max_ = std::max(max_, ms);
              }
              double Percentile(double fraction) const {
                  if (!count_) return 0;
                  const uint32_t target = std::max<uint32_t>(1, static_cast<uint32_t>(std::ceil(fraction * count_)));
                  uint32_t seen = 0;
                  for (int i = 0; i < kBuckets; ++i) {
                      seen += bucket_[i];
                      if (seen >= target) return i == kBuckets - 1 ? max_ : (i + 1) * 0.5;
                  }
                  return max_;
              }
              double Max() const { return max_; }
              uint32_t Count() const { return count_; }
              void Clear() { *this = Histogram(); }

          private:
              static constexpr int kBuckets = 501;
              uint32_t bucket_[kBuckets] = {};
              uint32_t count_ = 0;
              double sum_ = 0;
              double max_ = 0;
          };

          class FrameMeter {
          public:
              const char* RendererName() const { return renderer_; }
              void SetRenderer(const char* name) { renderer_ = name; }
              void Frame(double totalMs, double gameMs, double acquireMs, double drawMs, double submitMs, int steps) {
                  if (totalMs <= 0 || totalMs > 5000) return;  // skip the gap after the app was in the background
                  hist_.Add(totalMs);
                  windowMs_ += totalMs;
                  game_ += gameMs;
                  acquire_ += acquireMs;
                  draw_ += drawMs;
                  submit_ += submitMs;
                  simSteps_ += steps;
                  if (steps > 1) ++multiStep_;
                  maxSteps_ = std::max(maxSteps_, steps);
                  if (totalMs > 33.4) ++slow33_;
                  if (totalMs > 50.0) ++slow50_;
                  if (totalMs > 100.0) ++slow100_;
                  if (totalMs >= worstTotal_) {
                      worstTotal_ = totalMs;
                      worstGame_ = gameMs;
                      worstAcquire_ = acquireMs;
                      worstDraw_ = drawMs;
                      worstSubmit_ = submitMs;
                      worstSteps_ = steps;
                  }
                  if (windowMs_ >= kWindowMs) Flush();
              }

          private:
              static constexpr double kWindowMs = 15000.0;

              void Flush() {
                  const double frames = hist_.Count();
                  const double seconds = windowMs_ / 1000.0;
                  std::fprintf(stderr, "gpu: perf v3 %s t=%.0fs fps=%.1f sim=%.1f p50=%.1f p95=%.1f p99=%.1f max=%.1f ms slow33=%u slow50=%u slow100=%u\n",
                               RendererName(), seconds, frames / seconds, simSteps_ / seconds, hist_.Percentile(0.50), hist_.Percentile(0.95),
                               hist_.Percentile(0.99), hist_.Max(), slow33_, slow50_, slow100_);
                  const uint32_t pipes = pipelineCreates.exchange(0, std::memory_order_relaxed);
                  const double pipeMs = pipelineMicros.exchange(0, std::memory_order_relaxed) / 1000.0;
                  const uint32_t textures = textureCreates.exchange(0, std::memory_order_relaxed);
                  const double textureMs = textureMicros.exchange(0, std::memory_order_relaxed) / 1000.0;
                  const double mipMs = mipMicros.exchange(0, std::memory_order_relaxed) / 1000.0;
                  mipCount.store(0, std::memory_order_relaxed);
                  const uint32_t flushes = flushCount.exchange(0, std::memory_order_relaxed);
                  const double flushMs = flushMicros.exchange(0, std::memory_order_relaxed) / 1000.0;
                  const long rss = ReadKilobytes("/proc/self/status", "VmRSS:");
                  const long avail = ReadKilobytes("/proc/meminfo", "MemAvailable:");
                  std::fprintf(stderr,
                               "gpu: perf2 avg game=%.1f acquire=%.1f draw=%.1f submit=%.1f ms, worst frame game=%.1f acquire=%.1f draw=%.1f "
                               "submit=%.1f ms steps=%d, multistep=%u maxsteps=%d, pipes=%u/%.1f ms tex=%u/%.1f ms (mips %.1f ms), uploads=%u/%.1f ms, rss=%ld avail=%ld MB\n",
                               game_ / frames, acquire_ / frames, draw_ / frames, submit_ / frames, worstGame_, worstAcquire_, worstDraw_,
                               worstSubmit_, worstSteps_, multiStep_, maxSteps_, pipes, pipeMs, textures, textureMs, mipMs, flushes, flushMs, rss < 0 ? -1 : rss / 1024,
                               avail < 0 ? -1 : avail / 1024);
                  hist_.Clear();
                  windowMs_ = game_ = acquire_ = draw_ = submit_ = 0;
                  worstTotal_ = worstGame_ = worstAcquire_ = worstDraw_ = worstSubmit_ = 0;
                  simSteps_ = 0;
                  multiStep_ = slow33_ = slow50_ = slow100_ = 0;
                  maxSteps_ = worstSteps_ = 0;
              }

              const char* renderer_ = "?";
              Histogram hist_;
              double windowMs_ = 0, game_ = 0, acquire_ = 0, draw_ = 0, submit_ = 0;
              double worstTotal_ = 0, worstGame_ = 0, worstAcquire_ = 0, worstDraw_ = 0, worstSubmit_ = 0;
              uint64_t simSteps_ = 0;
              uint32_t multiStep_ = 0, slow33_ = 0, slow50_ = 0, slow100_ = 0;
              int maxSteps_ = 0, worstSteps_ = 0;
          };

          inline FrameMeter& Meter() {
              static FrameMeter meter;
              return meter;
          }

          }  // namespace hotd2perf
          '''
          header_path = root / "src/port/render/perf_counters.h"
          header_path.write_text(HEADER, encoding="utf-8")
          print("wrote src/port/render/perf_counters.h")

          play = "src/port/tools/play.cpp"
          edit(play,
               '#include "port/play/update_prompt.h"\n',
               '#include "port/play/update_prompt.h"\n#include "port/render/perf_counters.h"\n')
          edit(play,
               "    for (;;) {\n        int steps = 1;\n        bool netStalled = false;\n",
               "    for (;;) {\n        const double hotdLoopStart = plat.Seconds();\n        int steps = 1;\n        bool netStalled = false;\n")
          edit(play,
               "const bool beganFrame = gpu->BeginFrame(clear);",
               "const double hotdBeforeBegin = plat.Seconds();\n"
               "        const bool beganFrame = gpu->BeginFrame(clear);\n"
               "        const double hotdAfterBegin = plat.Seconds();")
          edit(play,
               "if (!finishFrame()) return 1;  // only presentation can wait; gameplay uses the fixed 60 Hz clock",
               "const double hotdBeforeSubmit = plat.Seconds();\n"
               "        if (!finishFrame()) return 1;  // only presentation can wait; gameplay uses the fixed 60 Hz clock\n"
               "        const double hotdAfterSubmit = plat.Seconds();")
          edit(play,
               "if (lastDeliveredSeconds > 0) frameStatistics.Observe((delivered - lastDeliveredSeconds) * 1000);",
               "if (lastDeliveredSeconds > 0) frameStatistics.Observe((delivered - lastDeliveredSeconds) * 1000);\n"
               "            if (lastDeliveredSeconds > 0)\n"
               "                hotd2perf::Meter().Frame((delivered - lastDeliveredSeconds) * 1000, (hotdBeforeBegin - hotdLoopStart) * 1000,\n"
               "                                         (hotdAfterBegin - hotdBeforeBegin) * 1000, (hotdBeforeSubmit - hotdAfterBegin) * 1000,\n"
               "                                         (hotdAfterSubmit - hotdBeforeSubmit) * 1000, steps);")

          edit(gpu,
               '#include "hotd2_vulkan_shaders.h"\n#endif\n',
               '#include "hotd2_vulkan_shaders.h"\n#endif\n#include "perf_counters.h"\n')
          edit(gpu,
               "    SDL_GPUGraphicsPipeline* p = SDL_CreateGPUGraphicsPipeline(dev_, &pi);\n",
               "    SDL_GPUGraphicsPipeline* p = nullptr;\n"
               "    {\n"
               "        hotd2perf::Scope timing(hotd2perf::pipelineCreates, hotd2perf::pipelineMicros);\n"
               "        p = SDL_CreateGPUGraphicsPipeline(dev_, &pi);\n"
               "    }\n")
          edit(gpu,
               "GpuTexture SdlGpuDevice::CreateTexture(const RgbaImage& img, bool alphaWeighted) {\n",
               "GpuTexture SdlGpuDevice::CreateTexture(const RgbaImage& img, bool alphaWeighted) {\n"
               "    hotd2perf::Scope timing(hotd2perf::textureCreates, hotd2perf::textureMicros);\n")

          # 5. Every build gets a higher versionCode, so Android always accepts it as an update.
          edit("android/game/build.gradle",
               "def abi = providers.gradleProperty('hotd2Abi').getOrElse('arm64-v8a')\n",
               "def abi = providers.gradleProperty('hotd2Abi').getOrElse('arm64-v8a')\n"
               "def versionNumber = (project.findProperty('hotd2VersionCode') ?: '3').toInteger()\n")
          edit("android/game/build.gradle",
               "        versionCode 3\n",
               "        versionCode versionNumber\n")

          # 6. Sign with the fixed key explicitly (-Photd2Keystore=<file>) instead of relying on the default debug keystore location.
          edit("android/game/build.gradle",
               "def versionNumber = (project.findProperty('hotd2VersionCode') ?: '3').toInteger()\n",
               "def versionNumber = (project.findProperty('hotd2VersionCode') ?: '3').toInteger()\n"
               "def fixedKeystore = project.findProperty('hotd2Keystore')\n")
          edit("android/game/build.gradle",
               "    buildTypes {\n        debug {\n",
               "    signingConfigs {\n"
               "        if (fixedKeystore) {\n"
               "            hotd2fixed {\n"
               "                storeFile file(fixedKeystore)\n"
               "                storePassword 'android'\n"
               "                keyAlias 'androiddebugkey'\n"
               "                keyPassword 'android'\n"
               "            }\n"
               "        }\n"
               "    }\n\n"
               "    buildTypes {\n        debug {\n"
               "            if (fixedKeystore) signingConfig signingConfigs.hotd2fixed\n")
          print("done")


          # 7. Version 3: batch texture uploads (one copy pass + one shared staging buffer + one submit per frame),
          #    time the mip generation separately, name the renderer in the meter, and shorten the catch-up after a hitch.
          edit(gpu,
               "    std::vector<SDL_GPUTexture*> textures_;  // handle = index + 1\n",
               "    std::vector<SDL_GPUTexture*> textures_;  // handle = index + 1\n"
               "    SDL_GPUCommandBuffer* uploadCmd_ = nullptr;\n"
               "    SDL_GPUCopyPass* uploadPass_ = nullptr;\n"
               "    SDL_GPUTransferBuffer* uploadBuf_ = nullptr;\n"
               "    uint8_t* uploadMap_ = nullptr;\n"
               "    uint32_t uploadCap_ = 0, uploadUsed_ = 0;\n"
               "    void FlushPendingUploads();\n")
          edit(gpu,
               "SdlGpuDevice::~SdlGpuDevice() {\n    if (!dev_) return;\n",
               "SdlGpuDevice::~SdlGpuDevice() {\n    if (!dev_) return;\n    FlushPendingUploads();\n")
          edit(gpu,
               "bool SdlGpuDevice::BeginFrame(const float clear[4]) {\n",
               "bool SdlGpuDevice::BeginFrame(const float clear[4]) {\n    FlushPendingUploads();\n")
          edit(gpu,
               "    SDL_SubmitGPUCommandBuffer(cmd_);\n    cmd_ = nullptr;\n",
               "    FlushPendingUploads();\n    SDL_SubmitGPUCommandBuffer(cmd_);\n    cmd_ = nullptr;\n")

          gtext = (root / gpu).read_text(encoding="utf-8")
          start = gtext.index("GpuTexture SdlGpuDevice::CreateTexture(")
          end = gtext.index("void SdlGpuDevice::SetStaticVertices(")
          NEW_CREATE = r'''void SdlGpuDevice::FlushPendingUploads() {
              if (!uploadCmd_) return;
              hotd2perf::Scope timing(hotd2perf::flushCount, hotd2perf::flushMicros);
              SDL_EndGPUCopyPass(uploadPass_);
              if (uploadMap_) SDL_UnmapGPUTransferBuffer(dev_, uploadBuf_);
              SDL_SubmitGPUCommandBuffer(uploadCmd_);
              if (uploadBuf_) SDL_ReleaseGPUTransferBuffer(dev_, uploadBuf_);  // deferred until the upload is done
              uploadCmd_ = nullptr;
              uploadPass_ = nullptr;
              uploadBuf_ = nullptr;
              uploadMap_ = nullptr;
              uploadCap_ = uploadUsed_ = 0;
          }

          GpuTexture SdlGpuDevice::CreateTexture(const RgbaImage& img, bool alphaWeighted) {
              hotd2perf::Scope timing(hotd2perf::textureCreates, hotd2perf::textureMicros);
              if (img.width <= 0 || img.height <= 0 || img.pixels.size() != static_cast<size_t>(img.width) * img.height * 4) return 0;
              std::vector<RgbaImage> mips;
              {
                  hotd2perf::Scope mipTiming(hotd2perf::mipCount, hotd2perf::mipMicros);
                  mips = BuildTextureMips(img, alphaWeighted);
              }
              std::vector<const RgbaImage*> levels = {&img};
              for (const auto& mip : mips) levels.push_back(&mip);
              SDL_GPUTextureCreateInfo ti = {};
              ti.type = SDL_GPU_TEXTURETYPE_2D;
              ti.format = SDL_GPU_TEXTUREFORMAT_R8G8B8A8_UNORM;
              ti.usage = SDL_GPU_TEXTUREUSAGE_SAMPLER;
              ti.width = img.width;
              ti.height = img.height;
              ti.layer_count_or_depth = 1;
              ti.num_levels = static_cast<Uint32>(levels.size());
              SDL_GPUTexture* t = SDL_CreateGPUTexture(dev_, &ti);
              if (!t) return 0;
              std::vector<uint32_t> offsets, pitches;
              uint32_t bytes = 0;
              for (const auto* level : levels) {
                  bytes = (bytes + 511u) & ~511u;
                  offsets.push_back(bytes);
                  const uint32_t pitch = (static_cast<uint32_t>(level->width) * 4 + 255u) & ~255u;
                  pitches.push_back(pitch);
                  bytes += pitch * level->height;
              }
              // All textures created before the next frame share one staging buffer, one copy pass and one submit.
              uploadUsed_ = (uploadUsed_ + 511u) & ~511u;
              if (uploadBuf_ && uploadUsed_ + bytes > uploadCap_) FlushPendingUploads();
              if (!uploadBuf_) {
                  SDL_GPUTransferBufferCreateInfo bi = {};
                  bi.usage = SDL_GPU_TRANSFERBUFFERUSAGE_UPLOAD;
                  bi.size = std::max<uint32_t>(bytes, 8u * 1024u * 1024u);
                  uploadBuf_ = SDL_CreateGPUTransferBuffer(dev_, &bi);
                  if (uploadBuf_) uploadMap_ = static_cast<uint8_t*>(SDL_MapGPUTransferBuffer(dev_, uploadBuf_, false));
                  if (uploadBuf_ && uploadMap_) uploadCmd_ = SDL_AcquireGPUCommandBuffer(dev_);
                  if (uploadCmd_) uploadPass_ = SDL_BeginGPUCopyPass(uploadCmd_);
                  if (!uploadPass_) {
                      if (uploadCmd_) SDL_CancelGPUCommandBuffer(uploadCmd_);
                      if (uploadBuf_) SDL_ReleaseGPUTransferBuffer(dev_, uploadBuf_);
                      uploadCmd_ = nullptr;
                      uploadBuf_ = nullptr;
                      uploadMap_ = nullptr;
                      uploadCap_ = uploadUsed_ = 0;
                      SDL_ReleaseGPUTexture(dev_, t);
                      return 0;
                  }
                  uploadCap_ = bi.size;
                  uploadUsed_ = 0;
              }
              const uint32_t base = uploadUsed_;
              for (size_t i = 0; i < levels.size(); ++i)
                  for (int y = 0; y < levels[i]->height; ++y)
                      memcpy(uploadMap_ + base + offsets[i] + y * pitches[i],
                             levels[i]->pixels.data() + static_cast<size_t>(y) * levels[i]->width * 4, levels[i]->width * 4);
              for (size_t i = 0; i < levels.size(); ++i) {
                  SDL_GPUTextureTransferInfo src = {};
                  src.transfer_buffer = uploadBuf_;
                  src.offset = base + offsets[i];
                  src.pixels_per_row = pitches[i] / 4;
                  src.rows_per_layer = levels[i]->height;
                  SDL_GPUTextureRegion dst = {};
                  dst.texture = t;
                  dst.mip_level = static_cast<Uint32>(i);
                  dst.w = levels[i]->width;
                  dst.h = levels[i]->height;
                  dst.d = 1;
                  SDL_UploadToGPUTexture(uploadPass_, &src, &dst, false);
              }
              uploadUsed_ = base + bytes;
              textures_.push_back(t);
              return textures_.size();
          }

          '''
          (root / gpu).write_text(gtext[:start] + NEW_CREATE + gtext[end:], encoding="utf-8")
          print("patched batched CreateTexture")

          # Renderer name in the meter, set once where the engine already prints it.
          edit(play,
               'if (!headless) printf("play: renderer %s, input %s\\n", gpu->Name(), guns ? guns->Name() : "none");',
               'hotd2perf::Meter().SetRenderer(gpu->Name());\n'
               '    if (!headless) printf("play: renderer %s, input %s\\n", gpu->Name(), guns ? guns->Name() : "none");')

          # After a stall keep at most 0.1 s of backlog (6 steps) instead of 0.25 s (15 steps): less fast-forward after a hitch.
          edit("src/port/platform/fixed_clock.h",
               "if (accumulator_ > 0.25) accumulator_ = 0.25;",
               "if (accumulator_ > 0.10) accumulator_ = 0.10;")
          PY
          python3 -I "$RUNNER_TEMP/apply_changes.py" "$GITHUB_WORKSPACE"

      - name: Build the 32-bit APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android --no-daemon --console=plain :game:assembleDebug \
            -Photd2Abi=armeabi-v7a -Photd2ApplicationId=com.codepdbh.hotd2evolved.armv7test \
            -Photd2VersionCode=$((100 + GITHUB_RUN_NUMBER)) \
            -Photd2Keystore="$HOME/.android/debug.keystore"
          cp android/game/build/outputs/apk/debug/game-debug.apk hotd2re-armv7-test.apk

      - name: Check that the APK carries the fixed signature
        run: |
          EXPECTED_HEX=$(echo "$EXPECTED_FINGERPRINT" | tr -d ':' | tr 'A-F' 'a-f')
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs hotd2re-armv7-test.apk | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -qi "certificate SHA-256 digest: $EXPECTED_HEX" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::El APK no quedo firmado con la clave fija. No se publica."
            exit 1
          fi
          echo "Signature OK: the update will install over the previous test build."

      - name: Keep the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotd2re-armv7-test-apk
          path: hotd2re-armv7-test.apk

      - name: Publish the APK as a pre-release (direct download from the phone)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "armv7-test-${{ github.run_number }}" hotd2re-armv7-test.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "armv7 test build ${{ github.run_number }}" \
            --notes "Experimental 32-bit test build with the frame-time meter and batched texture uploads (v3). Signed with the fixed test key, so it installs over the previous one."
