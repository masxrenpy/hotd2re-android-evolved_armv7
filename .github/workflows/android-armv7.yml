name: Android armv7 test build

# Manual run only: Actions tab > "Android armv7 test build" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.30.5"

      - name: Download SDL 3.4.18 (pinned, checked by SHA-256)
        run: |
          mkdir -p .work/deps
          curl --fail --location --silent --show-error -o .work/deps/SDL3-3.4.18.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
          echo "9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3  .work/deps/SDL3-3.4.18.tar.gz" | sha256sum -c -
          tar -xzf .work/deps/SDL3-3.4.18.tar.gz -C .work/deps

      - name: Apply the test changes
        run: |
          cat > "$RUNNER_TEMP/apply_changes.py" <<'PY'
          #!/usr/bin/env python3
          """Experimental changes for the armeabi-v7a test build (PowerVR GE8320 start-up failure).

          Usage: apply_changes.py <repo root>   (SDL 3.4.18 must already be extracted in <repo>/.work/deps)
          Every edit asserts that its anchor text exists exactly once, so a mismatch stops the build loudly.
          """
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1]).resolve()


          def edit(path, old, new):
              file = root / path
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  sys.exit(f"ERROR: expected 1 match in {path}, found {count} for: {old[:70]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")
              print(f"patched {path}")


          # 1. Launcher diagnostics: show the real renderer error and the GPU feature line.
          diag = "android/game/src/main/java/com/codepdbh/hotd2evolved/GameDiagnostics.java"
          edit(diag,
               "    private static final int LOG_LIMIT = 24 * 1024;\n",
               "    private static final int LOG_LIMIT = 24 * 1024;\n"
               "    private static final Pattern SAFE_GPU_LINE = Pattern.compile(\"gpu: [A-Za-z0-9 _.:,=()/|-]{1,300}\");\n")
          edit(diag,
               '        if (line.startsWith("renderer: ")) return "Renderer initialization failed";\n',
               '        if (line.startsWith("gpu: ") && SAFE_GPU_LINE.matcher(line).matches()) return line;\n'
               '        if (line.startsWith("renderer: ")) return "Renderer initialization failed: " + cleanDetail(line.substring(10));\n')
          edit(diag,
               "    private static List<String> readLines(Path file) {\n",
               "    private static String cleanDetail(String detail) {\n"
               "        String clean = detail.replaceAll(\"[^A-Za-z0-9 _.:,=()/|-]\", \"?\");\n"
               "        return clean.length() > 240 ? clean.substring(0, 240) : clean;\n"
               "    }\n\n"
               "    private static List<String> readLines(Path file) {\n")
          edit(diag,
               'appendRecent(report, "Engine", engine, 8);',
               'appendRecent(report, "Engine", engine, 14);')

          # 2. Engine: if SDL rejects the GPU, retry without the optional Vulkan features.
          gpu = "src/port/render/sdl_gpu_device.cpp"
          edit(gpu,
               "    SDL_GPUPresentMode presentMode_ = SDL_GPU_PRESENTMODE_VSYNC;\n",
               "    SDL_GPUPresentMode presentMode_ = SDL_GPU_PRESENTMODE_VSYNC;\n"
               "    bool relaxedFeatures_ = false;\n")
          edit(gpu,
               "    if (!dev_) {\n"
               '        if (error) *error = std::string("SDL_CreateGPUDevice: ") + SDL_GetError();\n'
               "        return false;\n"
               "    }\n",
               "    std::string retryNote;\n"
               "#ifdef __ANDROID__\n"
               "    if (!dev_) {\n"
               "        // Some GPUs (PowerVR Rogue, for one) lack optional Vulkan features that SDL asks for by default.\n"
               "        const std::string firstReason = SDL_GetError();\n"
               '        std::fprintf(stderr, "gpu: default Vulkan device failed; retrying without optional features\\n");\n'
               "        const SDL_PropertiesID relaxed = SDL_CreateProperties();\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_SHADERS_SPIRV_BOOLEAN, true);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_DEBUGMODE_BOOLEAN, false);\n"
               "        SDL_SetStringProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_NAME_STRING, driver);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_FEATURE_ANISOTROPY_BOOLEAN, false);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_FEATURE_DEPTH_CLAMPING_BOOLEAN, false);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_FEATURE_CLIP_DISTANCE_BOOLEAN, false);\n"
               "        SDL_SetBooleanProperty(relaxed, SDL_PROP_GPU_DEVICE_CREATE_FEATURE_INDIRECT_DRAW_FIRST_INSTANCE_BOOLEAN, false);\n"
               "        dev_ = SDL_CreateGPUDeviceWithProperties(relaxed);\n"
               "        SDL_DestroyProperties(relaxed);\n"
               "        if (dev_) {\n"
               "            relaxedFeatures_ = true;\n"
               '            std::fprintf(stderr, "gpu: running without optional Vulkan features\\n");\n'
               "        } else {\n"
               '            retryNote = " (first attempt: " + firstReason + ")";\n'
               "        }\n"
               "    }\n"
               "#endif\n"
               "    if (!dev_) {\n"
               '        if (error) *error = std::string("SDL_CreateGPUDevice: ") + SDL_GetError() + retryNote;\n'
               "        return false;\n"
               "    }\n")
          edit(gpu,
               "capabilities_.maxAnisotropy = 16;",
               "capabilities_.maxAnisotropy = relaxedFeatures_ ? 1 : 16;")
          edit(gpu,
               "if (s.mipmapped && graphics_.anisotropy > 1) {",
               "if (s.mipmapped && graphics_.anisotropy > 1 && !relaxedFeatures_) {")

          # 3. SDL: do not force three features the game does not use, and print what the GPU reports.
          vk = ".work/deps/SDL3-3.4.18/src/gpu/vulkan/SDL_gpu_vulkan.c"
          edit(vk,
               "    features->desiredVulkan10DeviceFeatures.independentBlend = VK_TRUE;\n"
               "    features->desiredVulkan10DeviceFeatures.sampleRateShading = VK_TRUE;\n"
               "    features->desiredVulkan10DeviceFeatures.imageCubeArray = VK_TRUE;\n",
               "    // HOTD2RE test build: the game uses one colour target, no cube arrays and no per-sample shading.\n"
               "    features->desiredVulkan10DeviceFeatures.independentBlend = VK_FALSE;\n"
               "    features->desiredVulkan10DeviceFeatures.sampleRateShading = VK_FALSE;\n"
               "    features->desiredVulkan10DeviceFeatures.imageCubeArray = VK_FALSE;\n")
          edit(vk,
               "    renderer->vkGetPhysicalDeviceFeatures(\n"
               "        physicalDevice,\n"
               "        &deviceFeatures);\n"
               "\n"
               "    if ((!deviceFeatures.independentBlend",
               "    renderer->vkGetPhysicalDeviceFeatures(\n"
               "        physicalDevice,\n"
               "        &deviceFeatures);\n"
               "\n"
               "    {\n"
               "        static int hotd2FeatureLines = 0;\n"
               "        if (hotd2FeatureLines++ < 2) {\n"
               '            fprintf(stderr, "gpu: Vulkan features independentBlend=%d imageCubeArray=%d depthClamp=%d shaderClipDistance=%d drawIndirectFirstInstance=%d sampleRateShading=%d samplerAnisotropy=%d\\n",\n'
               "                        (int)deviceFeatures.independentBlend, (int)deviceFeatures.imageCubeArray, (int)deviceFeatures.depthClamp,\n"
               "                        (int)deviceFeatures.shaderClipDistance, (int)deviceFeatures.drawIndirectFirstInstance,\n"
               "                        (int)deviceFeatures.sampleRateShading, (int)deviceFeatures.samplerAnisotropy);\n"
               "        }\n"
               "    }\n"
               "\n"
               "    if ((!deviceFeatures.independentBlend")
          print("done")
          PY
          python3 -I "$RUNNER_TEMP/apply_changes.py" "$GITHUB_WORKSPACE"

      - name: Build the 32-bit APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android --no-daemon --console=plain :game:assembleDebug \
            -Photd2Abi=armeabi-v7a -Photd2ApplicationId=com.codepdbh.hotd2evolved.armv7test
          cp android/game/build/outputs/apk/debug/game-debug.apk hotd2re-armv7-test.apk

      - name: Keep the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotd2re-armv7-test-apk
          path: hotd2re-armv7-test.apk

      - name: Publish the APK as a pre-release (direct download from the phone)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "armv7-test-${{ github.run_number }}" hotd2re-armv7-test.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "armv7 test build ${{ github.run_number }}" \
            --notes "Experimental 32-bit test build. Installs next to the normal app (different package name)."
